<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenChat - 开源免费AI解决方案</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="index-page">
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="images/icons/robot-icon.svg" alt="OpenChat" class="logo-icon">
                <span class="logo-text">OpenChat</span>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">首页</a>
                <a href="compatibility.html" class="nav-link">多元兼容</a>
                <a href="opensource.html" class="nav-link">免费开源</a>
                <a href="faq.html" class="nav-link">FAQ</a>
                <button class="download-btn">下载客户端</button>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <!-- 英雄区域 -->
        <section class="hero-section">
            <div class="hero-content">
                <div class="hero-title">
                    <img src="images/icons/robot-icon.svg" alt="OpenChat" class="title-icon">
                    <h1>OpenChat</h1>
                </div>
                <p class="hero-description">
                    开源免费的AI解决方案,保护您的数据安全,提供强大的文档处理和智能助手功能<br>
                    无需注册!即可开启您的大模型体验!!
                </p>
                <div class="download-buttons">
                    <button class="download-btn-platform">
                        <img src="images/icons/windows-icon.svg" alt="Windows">
                        <span>Windows 下载</span>
                    </button>
                    <button class="download-btn-platform">
                        <img src="images/icons/mac-icon.svg" alt="Mac M1">
                        <span>Mac M1 下载</span>
                    </button>
                    <button class="download-btn-platform">
                        <img src="images/icons/mac-icon.svg" alt="Mac Intel">
                        <span>Mac Intel 下载</span>
                    </button>
                </div>
            </div>
            
            <!-- 产品展示区域 -->
            <div class="product-showcase">
                <div class="laptop-mockup">
                    <img src="images/mockups/laptop-interface.svg" alt="OpenChat界面展示" class="laptop-image">
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
